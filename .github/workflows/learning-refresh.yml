name: Daily event learning refresh
on:
  schedule:
    # Morning, premarket and evening UTC slots also cover both Paris DST offsets.
    - cron: '10 6,7,12,13,20,21 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: monetizable-learning-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh and verify dated learning content in the existing cloud
        run: |
          node --input-type=module <<'JS'
          for (let attempt = 1; attempt <= 3; attempt++) {
            try {
              const r = await fetch('https://getmonetizable.com/api/refresh', {signal: AbortSignal.timeout(90000)});
              const data = await r.json();
              if (!r.ok || !data.learning || data.learning.status !== 'ready' || data.learning.count < 1) throw Error('Learning refresh did not produce verified contextual content');
              console.log(JSON.stringify({status: data.status, learning: data.learning}));
              break;
            } catch (error) {
              if (attempt === 3) throw error;
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
          }
          JS
