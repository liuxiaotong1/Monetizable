name: Public search foundation
on:
  push:
    branches: [main]
    paths:
      - 'src/lib/marketing/**'
      - 'src/components/marketing/**'
      - 'src/app/[slug]/**'
      - 'src/app/blog/**'
      - 'src/components/account/account-shell.tsx'
      - 'src/app/page.tsx'
      - 'src/app/layout.tsx'
      - 'src/app/sitemap.ts'
      - 'src/app/robots.ts'
      - 'tests/search-foundation.mjs'
      - 'tests/growth-attribution.mjs'
      - 'src/app/api/growth/**'
      - 'src/app/api/billing/**'
      - 'src/components/account/analytics.tsx'
      - '.github/workflows/search-foundation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node tests/search-foundation.mjs
      - run: node tests/growth-attribution.mjs
      - run: node tests/pro-plans.mjs
      - run: node tests/learning-card-ux.mjs
      - run: node tests/account-policy.mjs
