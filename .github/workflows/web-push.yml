name: Monetizable web push
on:
  schedule:
    # Hourly at minute 7. Slots stay due until their cutoff, so one tick an hour
    # still sends each reminder once. The shortest window is the 45 minutes
    # before the 9:30 New York open, and :07 falls inside it in both US
    # daylight and standard time. Event eve is 17:00–23:30 Paris, review runs
    # until 22:30 New York, and knowledge follows each subscriber's clock.
    # The API returns after a cheap read when nobody is inside a window.
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send due companion reminders
        env:
          QUEST_REPORT_TOKEN: ${{ secrets.QUEST_REPORT_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $QUEST_REPORT_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{}' \
            https://getmonetizable.com/api/push/dispatch
