name: Monetizable web push
on:
  schedule:
    # GitHub often delivers only a handful of these ticks per day. Reminder
    # planning catches up until each slot's cutoff, and these extra clocks sit
    # inside the Paris afternoon and the US morning windows.
    - cron: '*/15 * * * *'
    - cron: '7 11,15,16,20 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send due companion reminders
        env:
          QUEST_REPORT_TOKEN: ${{ secrets.QUEST_REPORT_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $QUEST_REPORT_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{}' \
            https://getmonetizable.com/api/push/dispatch
