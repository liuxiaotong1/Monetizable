name: Public landing mobile audit
on:
  push:
    branches: [main, codex/mobile-landing-performance]
    paths:
      - '.github/workflows/landing-mobile-audit.yml'
      - 'src/components/marketing/public-landing*'
      - 'src/app/page.tsx'
      - 'src/app/layout.tsx'
      - 'src/components/i18n/**'
      - 'src/components/account/analytics.tsx'
  workflow_dispatch:
permissions:
  contents: read
  statuses: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for this production commit
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 40); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/status" --jq '.statuses[] | select(.context=="Vercel") | .state' | head -1)
            if [ "$state" = "success" ]; then exit 0; fi
            if [ "$state" = "failure" ]; then exit 1; fi
            sleep 10
          done
          exit 1
      - name: Audit anonymous mobile homepage
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          npx --yes lighthouse@12.8.2 https://getmonetizable.com/ --only-categories=performance --output=json --output-path=landing-mobile.json --chrome-flags="--headless --no-sandbox" --quiet
      - name: Summarize measured results
        run: |
          node <<'JS'
          const fs=require('fs'),r=JSON.parse(fs.readFileSync('landing-mobile.json','utf8')),a=r.audits,requests=a['network-requests'].details.items;
          const scripts=requests.filter(x=>x.resourceType==='Script');
          const summary={url:r.finalDisplayedUrl,fetchedAt:r.fetchTime,performance:Math.round(r.categories.performance.score*100),lcpMs:a['largest-contentful-paint'].numericValue,tbtMs:a['total-blocking-time'].numericValue,cls:a['cumulative-layout-shift'].numericValue,totalTransferKiB:Math.round(requests.reduce((s,x)=>s+(x.transferSize||0),0)/1024),scriptTransferKiB:Math.round(scripts.reduce((s,x)=>s+(x.transferSize||0),0)/1024),scripts:scripts.map(x=>({url:x.url,bytes:x.transferSize})),modelRequests:requests.filter(x=>/\.glb|\.gltf|battle-demo|heroes-3d/.test(x.url)).map(x=>x.url)};
          console.log(JSON.stringify(summary,null,2));fs.writeFileSync('landing-metrics.json',JSON.stringify(summary,null,2));fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'Mobile landing audit\n\n```json\n'+JSON.stringify(summary,null,2)+'\n```\n');
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: landing-mobile-${{ github.sha }}
          path: |
            landing-mobile.json
            landing-metrics.json
          retention-days: 14
